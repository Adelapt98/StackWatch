stackwatch:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', '127.0.0.1') }}"
      port: "{{ env_var('PGPORT', '5434') | int }}"
      user: "{{ env_var('PGUSER', 'stackwatch') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'stackwatch') }}"
      schema: analytics
      threads: 2
